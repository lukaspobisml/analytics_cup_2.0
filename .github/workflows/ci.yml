name: DLOI-Pose CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        pip install ".[docs]"

    - name: Run automated test suite
      run: |
        python -m unittest discover tests

    - name: Smoke test installed package outside checkout
      working-directory: ${{ runner.temp }}
      run: |
        python -c "from src.data.pose_loading import iter_sample; from src.features import DefensiveLaneOcclusion; import src.visualization.sectioned_summary_table_viz; assert next(iter_sample())['frame'] > 0"

    - name: Build documentation
      run: python -m mkdocs build --strict