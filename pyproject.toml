[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dloi-pose"
version = "0.2.0"
description = "Exploratory pose-informed ground passing lane occlusion for football analytics"
readme = "README.md"
authors = [{ name = "Analytics Cup 2.0 Contributor" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "mplsoccer>=1.2.0",
    "shapely>=1.8.0",
    "humanize>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
notebook = ["jupyter>=1.0"]
docs = ["mkdocs>=1.6"]

[tool.setuptools]
packages = ["src", "src.data", "src.features", "src.visualization", "src.bodypose"]

[tool.setuptools.package-dir]
"src" = "src"
"src.bodypose" = "data/bodypose"

[tool.setuptools.package-data]
"src.bodypose" = ["MANIFEST.json", "*.jsonl.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]